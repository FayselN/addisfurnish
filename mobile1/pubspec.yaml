name: addisfurnish
description: "AddisHome — used furniture marketplace for Ethiopia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  geolocator: ^13.0.2
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  http: ^1.2.0
  get_it: ^8.0.3
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#F5EEE2"
  adaptive_icon_foreground: "assets/android-icon-foreground.png"
  adaptive_icon_monochrome: "assets/android-icon-monochrome.png"
  min_sdk_android: 21
  remove_alpha_ios: true
